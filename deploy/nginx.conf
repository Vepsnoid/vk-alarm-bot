# nginx для VK Alarm Bot: проксирует FastAPI (он же отдаёт собранный SPA).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vk-alarm
#   sudo nano /etc/nginx/sites-available/vk-alarm     # свой server_name
#   sudo ln -s /etc/nginx/sites-available/vk-alarm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx

server {
    listen 80;
    listen [::]:80;

    server_name alarm.example.com;   # <-- ваш домен

    # Медиа из VK может быть крупным
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Проверка источников и публикация медиа могут занимать минуты
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
